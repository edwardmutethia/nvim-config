# Alacritty — GNOME Adwaita Dark (matches the dark title bar/headerbar palette)

[general]
live_config_reload = true

[window]
dimensions = { columns = 90, lines = 22 }
padding = { x = 16, y = 16 }
dynamic_padding = true
decorations = "Full"
opacity = 1.0
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[bell]
# Visual bell stays disabled; use duration > 0 with an animation to re-enable.
duration = 0

[colors.primary]
background = "#222226"
foreground = "#ffffff"
dim_foreground = "#c0bfbc"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#222226"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text = "#222226"
cursor = "#3584e4"

[colors.selection]
text = "#ffffff"
background = "#3584e4"

[colors.search.matches]
foreground = "#222226"
background = "#f6d32d"

[colors.search.focused_match]
foreground = "#222226"
background = "#33d17a"

[colors.normal]
black   = "#3d3846"
red     = "#f66151"
green   = "#33d17a"
yellow  = "#f6d32d"
blue    = "#3584e4"
magenta = "#c061cb"
cyan    = "#2190a4"
white   = "#c0bfbc"

[colors.bright]
black   = "#5e5c64"
red     = "#ed333b"
green   = "#8ff0a4"
yellow  = "#f9f06b"
blue    = "#99c1f1"
magenta = "#dc8add"
cyan    = "#62a0ea"
white   = "#ffffff"
