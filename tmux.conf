# ============================================================
# TMUX CONFIGURATION
# ============================================================

# ---------- General ----------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ',xterm*:RGB:extkeys'
set -g extended-keys on
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g renumber-windows on
set -g detach-on-destroy off

# Window/pane numbering starts at 1 so the M-1..M-5 bindings below are intuitive.
set -g base-index 1
setw -g pane-base-index 1

set -g status-keys vi
set -g display-time 2000
set -ga update-environment " DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR SSH_AUTH_SOCK"

# ---------- Prefix ----------
# Use Ctrl+A instead of Ctrl+B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------- Reload configuration ----------
bind r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# ---------- Pane management ----------
# Split panes using | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Keep the current directory when splitting
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Navigate panes using Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes using Ctrl + arrow keys
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

# ---------- Windows ----------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ---------- Copy mode ----------
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
set -g set-clipboard on

# ---------- Status bar ----------
# Minimal: transparent background, muted session + window names, no clock.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=default,fg=#7f849c"
set -g status-left-length 20
set -g status-right-length 20

set -g status-left "#[fg=#6c7086]#S "
set -g status-right ""

setw -g window-status-format "#[fg=#7f849c] #W "
setw -g window-status-current-format "#[fg=#cdd6f4,bold] #W "
setw -g window-status-activity-style "fg=#f38ba8"
setw -g window-status-bell-style "fg=#f9e2af"

# ---------- Pane borders ----------
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#6c7086"

# ---------- Messages / modes ----------
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#313244,fg=#cdd6f4"

# ---------- Performance ----------
set -s escape-time 10
set -g repeat-time 500

# Copy-mode bindings and clipboard integration are defined in the Copy mode
# section above.
